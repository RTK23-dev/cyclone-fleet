openapi: 3.1.0
info:
  title: Cyclone Cloud Control API
  version: 0.2.0
  description: >-
    ChatGPT Actions front door for VMOS phones. Mutations execute through
    Cyclone Mobile PhoneToolExecutor. The short-lived SESSION_TOKEN from the
    latest Cyclone handoff is sent in X-Cyclone-Session-Token on every protected action.
servers:
  - url: https://CONTROL_API_HOST_PLACEHOLDER
    description: Cyclone One binds this to the current public CONTROL_API before you paste the schema.
components:
  parameters:
    CycloneSessionToken:
      name: X-Cyclone-Session-Token
      in: header
      required: true
      description: >-
        Short-lived SESSION_TOKEN from the latest CYCLONE_VMOS_ATTACH_v1 block.
        This is not an SSH Connect Key, VMOS AccessKey, or Cyclone One gateway token.
      schema:
        type: string
        minLength: 16
  schemas:
    DeviceStatus:
      type: object
      properties:
        deviceId: { type: string }
        sessionId: { type: string }
        adb: { type: string, enum: [device, offline, unauthorized, missing] }
        mobileInstalled: { type: boolean }
        mobileRunning: { type: boolean }
        gatewayReady: { type: boolean }
        trustReady: { type: boolean }
        mutationEngine: { type: string }
        message: { type: string }
    ObserveResult:
      type: object
      properties:
        deviceId: { type: string }
        sessionId: { type: string }
        screenshotUrl: { type: string, format: uri }
        summary: { type: string }
        foregroundPackage: { type: string }
        observationId: { type: string }
        mutationEngine: { type: string }
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Check Cloud Control and confirm PhoneToolExecutor is the mutation engine
      responses:
        '200':
          description: OK
  /v1/devices:
    get:
      operationId: listDevices
      summary: List only the device authorized by the current Cyclone session token
      parameters:
        - $ref: '#/components/parameters/CycloneSessionToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        deviceId: { type: string }
                        label: { type: string }
                        adb: { type: string }
                        mobileInstalled: { type: boolean }
                        mobileRunning: { type: boolean }
  /v1/devices/{deviceId}/status:
    get:
      operationId: getDeviceStatus
      summary: Check ADB, Cyclone Mobile, Gateway pairing and trust for the attached device
      parameters:
        - $ref: '#/components/parameters/CycloneSessionToken'
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: sessionId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceStatus' }
  /v1/devices/{deviceId}/observe:
    post:
      operationId: observe
      summary: Capture a screenshot and compact UI summary through Cyclone
      parameters:
        - $ref: '#/components/parameters/CycloneSessionToken'
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string }
                includeUiSummary: { type: boolean, default: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObserveResult' }
  /v1/devices/{deviceId}/tap:
    post:
      operationId: tap
      summary: Tap through Cyclone Mobile PhoneToolExecutor
      parameters:
        - $ref: '#/components/parameters/CycloneSessionToken'
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, x, y]
              properties:
                sessionId: { type: string }
                x: { type: number }
                y: { type: number }
                normalized: { type: boolean, default: false }
                goal: { type: string }
      responses:
        '200':
          description: OK
  /v1/devices/{deviceId}/swipe:
    post:
      operationId: swipe
      summary: Swipe through Cyclone Mobile PhoneToolExecutor
      parameters:
        - $ref: '#/components/parameters/CycloneSessionToken'
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, x1, y1, x2, y2]
              properties:
                sessionId: { type: string }
                x1: { type: number }
                y1: { type: number }
                x2: { type: number }
                y2: { type: number }
                durationMs: { type: integer, default: 300 }
                goal: { type: string }
      responses:
        '200':
          description: OK
  /v1/devices/{deviceId}/type:
    post:
      operationId: typeText
      summary: Type text through Cyclone Mobile PhoneToolExecutor
      parameters:
        - $ref: '#/components/parameters/CycloneSessionToken'
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, text]
              properties:
                sessionId: { type: string }
                text: { type: string }
                goal: { type: string }
      responses:
        '200':
          description: OK
  /v1/devices/{deviceId}/launch:
    post:
      operationId: launchApp
      summary: Launch an Android package/activity through Cyclone Mobile PhoneToolExecutor
      parameters:
        - $ref: '#/components/parameters/CycloneSessionToken'
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, packageName]
              properties:
                sessionId: { type: string }
                packageName: { type: string }
                activity: { type: string }
                goal: { type: string }
      responses:
        '200':
          description: OK
  /v1/devices/{deviceId}/key:
    post:
      operationId: pressKey
      summary: Press Back, Home, Recents or Enter through Cyclone Mobile PhoneToolExecutor
      parameters:
        - $ref: '#/components/parameters/CycloneSessionToken'
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, key]
              properties:
                sessionId: { type: string }
                key:
                  type: string
                  enum: [back, home, recents, enter]
                goal: { type: string }
      responses:
        '200':
          description: OK
