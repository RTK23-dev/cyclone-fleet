[package]
name = "cyclone-pc-companion"
version = "1.6.0-alpha.43"
description = "Cyclone One"
authors = ["Cyclone"]
edition = "2021"

[lib]
name = "cyclone_pc_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
