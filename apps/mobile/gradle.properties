org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Bound concurrent compiler work and give Compose compilation its own heap.
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx4096m
android.useAndroidX=true
kotlin.code.style=official
# Kyant0 Backdrop 1.0.0 is compiled against API 36. Cyclone 4.4.2 keeps targetSdk 35; only the
# compile surface moves to 36, so suppress AGP 8.7's compileSdk warning until the app toolchain moves.
android.suppressUnsupportedCompileSdk=36
# Prevent AGP from marking even debug APKs testOnly. Pixel PackageInstaller rejects those.
android.injected.testOnly=false
