name: Cyclone Mobile Personal Dev Publish 3.9.4

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Cyclone Mobile CI run ID for the exact 3.9.4 source
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: mobile-personal-dev-publish-v3.9.4
  cancel-in-progress: false

jobs:
  sign-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate successful 3.9.4 CI source build
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          test "$(jq -r '.name' <<< "$run_json")" = "Cyclone Mobile CI"
          test "$(jq -r '.path' <<< "$run_json")" = ".github/workflows/mobile-ci.yml"
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success"
          test "$(jq -r '.event' <<< "$run_json")" = "push"
          test "$(jq -r '.head_repository.full_name' <<< "$run_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head_branch' <<< "$run_json")" = "release/cyclone-mobile-v3.9.4"
          head_sha="$(jq -r '.head_sha' <<< "$run_json")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Download authoritative unsigned CI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Cyclone-Android-3.9.4
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Verify checksum, identity and provenance
        id: candidate
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          EXPECTED_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          test -s candidate/source-sha.txt
          test -s candidate/run-id.txt
          test -s candidate/mobile-metadata.json
          test -s candidate/signing-state.txt
          test "$(tr -d '\r\n' < candidate/source-sha.txt)" = "$EXPECTED_HEAD_SHA"
          test "$(tr -d '\r\n' < candidate/run-id.txt)" = "$EXPECTED_RUN_ID"
          test "$(tr -d '\r\n' < candidate/signing-state.txt)" = "UNSIGNED_VERIFIED_CANDIDATE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('candidate')
          metadata = json.loads((root / 'mobile-metadata.json').read_text())
          assert metadata['artifact_name'] == 'Cyclone-Android-3.9.4'
          assert metadata['application_id'] == 'com.cyclone.mobile'
          assert metadata['version_name'] == '3.9.4'
          assert int(metadata['version_code']) == 58
          assert metadata['apk_name'] == 'Cyclone-3.9.4.apk'
          assert (root / metadata['apk_name']).is_file()
          assert len(list(root.glob('*.apk'))) == 1
          PY
          (cd candidate && sha256sum --check Cyclone-3.9.4.apk.sha256)

      - name: Set up Android signing tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build tools
        shell: bash
        run: sdkmanager --install 'build-tools;35.0.0'

      - name: Recover update-compatible personal-development signer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          legacy_ref='release/cyclone-mobile-v3.9.0'
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/release.keystore.b64?ref=$legacy_ref" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/release.keystore.b64"
          base64 --decode "$RUNNER_TEMP/release.keystore.b64" > "$RUNNER_TEMP/release.keystore"
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/app/build.gradle.kts?ref=$legacy_ref" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/legacy.gradle.kts"
          python3 - "$RUNNER_TEMP/legacy.gradle.kts" "$RUNNER_TEMP/legacy-signing.env" <<'PY'
          import re, shlex, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          match = re.search(r'create\("ciRelease"\)\s*\{(?P<body>.*?)\n\s*\}', text, re.S)
          if not match:
              raise SystemExit('legacy ciRelease signing block not found')
          body = match.group('body')
          def value(name):
              found = re.search(rf'{name}\s*=\s*"([^"]+)"', body)
              if not found:
                  raise SystemExit(f'legacy {name} not found')
              return found.group(1)
          with open(sys.argv[2], 'w', encoding='utf-8') as out:
              out.write('STORE_PASSWORD=' + shlex.quote(value('storePassword')) + '\n')
              out.write('KEY_ALIAS=' + shlex.quote(value('keyAlias')) + '\n')
              out.write('KEY_PASSWORD=' + shlex.quote(value('keyPassword')) + '\n')
          PY
          chmod 600 "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/legacy-signing.env"

      - name: Sign, verify update continuity and package identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/legacy-signing.env"
          export STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          mkdir -p signed "$RUNNER_TEMP/previous"
          input='candidate/Cyclone-3.9.4.apk'
          output='signed/Cyclone-3.9.4.apk'
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$output" \
            "$input"
          "$apksigner" verify --min-sdk-version 34 --verbose --print-certs "$output" | tee signed/signing-info.txt
          "$aapt" dump badging "$output" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.cyclone.mobile'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='58'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='3.9.4'" "$RUNNER_TEMP/badging.txt"
          if grep -Eq 'testOnly[= ]true' "$RUNNER_TEMP/badging.txt"; then
            echo 'ERROR: signed release APK is testOnly.' >&2
            exit 1
          fi

          gh release download v3.9.3 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cyclone-3.9.3.apk' --dir "$RUNNER_TEMP/previous"
          previous_cert="$("$apksigner" verify --min-sdk-version 34 --print-certs "$RUNNER_TEMP/previous/Cyclone-3.9.3.apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          current_cert="$("$apksigner" verify --min-sdk-version 34 --print-certs "$output" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$previous_cert"
          test "$current_cert" = "$previous_cert"

          (cd signed && sha256sum Cyclone-3.9.4.apk > Cyclone-3.9.4.apk.sha256)
          cp candidate/source-sha.txt candidate/run-id.txt candidate/mobile-metadata.json signed/
          printf '%s\n' 'SIGNED_LEGACY_UPDATE_COMPATIBILITY_KEY_PERSONAL_DEV' > signed/signing-state.txt

      - name: Destroy recovered signing material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/release.keystore" \
            "$RUNNER_TEMP/release.keystore.b64" \
            "$RUNNER_TEMP/legacy.gradle.kts" \
            "$RUNNER_TEMP/legacy-signing.env" \
            "$RUNNER_TEMP/previous"

      - name: Upload signed personal-development artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cyclone-3.9.4-personal-dev
          path: signed/
          if-no-files-found: error
          retention-days: 30

      - name: Publish 3.9.4 prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          tag='v3.9.4'
          notes='Cyclone 3.9.4 personal-development prerelease. This build reuses the historical update-compatible development signer so it can update the existing personal-development install. That signer is not production-secure. CI tests/lint/build provenance are required before publication; physical Pixel 8 acceptance is not claimed by this workflow.'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
              signed/Cyclone-3.9.4.apk \
              signed/Cyclone-3.9.4.apk.sha256 \
              signed/source-sha.txt \
              signed/run-id.txt \
              signed/mobile-metadata.json \
              signed/signing-state.txt \
              signed/signing-info.txt
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$EXPECTED_HEAD_SHA" \
              --title 'Cyclone 3.9.4' \
              --prerelease \
              --notes "$notes" \
              signed/Cyclone-3.9.4.apk \
              signed/Cyclone-3.9.4.apk.sha256 \
              signed/source-sha.txt \
              signed/run-id.txt \
              signed/mobile-metadata.json \
              signed/signing-state.txt \
              signed/signing-info.txt
          fi
