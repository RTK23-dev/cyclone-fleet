name: Reusable Cyclone Mobile Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate product metadata and repository guards
        id: mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release_versions.py --check
          python3 scripts/ci/mobile_metadata.py --github-output "$GITHUB_OUTPUT" --json mobile-metadata.json
          python3 scripts/ci/mobile_product_guard.py
          python3 scripts/ci/repository_security_guard.py
          python3 -m unittest discover -s scripts/ci/tests -v

      - name: Verify PC Gateway and MCP contracts
        shell: bash
        run: |
          python3 -m pip install -e 'apps/device-gateway[test]' -e tools/codex-phone-mcp
          python3 -m pytest apps/device-gateway/tests -q
          python3 -m unittest discover -s tools/codex-phone-mcp/tests -v

      - name: Dry-run Windows gateway setup
        shell: pwsh
        run: ./scripts/phone-gateway/setup-cyclone-bridge.ps1 -DryRun

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The legacy aggregate package named `tools` was removed from Google's SDK repository.
          # setup-android defaults to `tools platform-tools`, so opt into the still-supported package
          # explicitly; the exact platform/build-tools versions are installed in the next step.
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager --install 'platforms;android-36' 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Test, lint and assemble unsigned release candidate
        shell: bash
        run: ./apps/mobile/gradlew -p apps/mobile :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace

      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            apps/mobile/app/build/reports/tests/
            apps/mobile/app/build/test-results/
            apps/mobile/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Package provenance
        shell: bash
        env:
          APK_NAME: ${{ steps.mobile.outputs.apk_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/mobile
          CANDIDATE=apps/mobile/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$CANDIDATE"
          cp "$CANDIDATE" "dist/mobile/$APK_NAME"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$SDK_ROOT/build-tools/35.0.0/aapt"
          BADGING=$("$AAPT" dump badging "dist/mobile/$APK_NAME")
          echo "$BADGING"
          if echo "$BADGING" | grep -Eq 'testOnly[= ]true'; then
            echo "ERROR: release candidate is testOnly" >&2
            exit 1
          fi
          (cd dist/mobile && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          printf '%s\n' "$GITHUB_SHA" > dist/mobile/source-sha.txt
          printf '%s\n' "$GITHUB_RUN_ID" > dist/mobile/run-id.txt
          printf '%s\n' 'UNSIGNED_VERIFIED_CANDIDATE' > dist/mobile/signing-state.txt
          cp mobile-metadata.json dist/mobile/mobile-metadata.json

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.mobile.outputs.artifact_name }}
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 30