name: Cyclone Mobile Personal Dev Publish 3.9.6

on:
  push:
    branches: ['release/cyclone-mobile-v3.9.6']
    paths:
      - 'apps/mobile/**'
      - 'apps/device-gateway/**'
      - 'tools/codex-phone-mcp/**'
      - 'tools/cyclone-agent-mcp/**'
      - 'scripts/ci/**'
      - 'scripts/phone-gateway/**'
      - 'release/version.toml'
      - '.github/workflows/_mobile-build.yml'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/mobile-dev-publish-v396.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: mobile-personal-dev-publish-v3.9.6
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse replacement of an existing 3.9.6 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.9.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'ERROR: v3.9.6 already exists. Release bytes are immutable; increment the version instead.' >&2
            exit 1
          fi

      - name: Wait for exact Mobile CI source run
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f head_sha="$GITHUB_SHA" -f event=push -f per_page=100)"
            row="$(jq -c '[.workflow_runs[] | select(.name == "Cyclone Mobile CI" and .path == ".github/workflows/mobile-ci.yml")] | sort_by(.created_at) | last // empty' <<< "$runs")"
            if [[ -n "$row" ]]; then
              status="$(jq -r '.status' <<< "$row")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$row")"
              run_id="$(jq -r '.id' <<< "$row")"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "ERROR: exact Mobile CI run $run_id finished as $conclusion" >&2
                  exit 1
                fi
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "Exact Mobile CI run $run_id succeeded for $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'ERROR: timed out waiting for exact Mobile CI run.' >&2
          exit 1

      - name: Download authoritative unsigned CI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Cyclone-Android-3.9.6
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Verify checksum, identity and provenance
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -euo pipefail
          test -s candidate/source-sha.txt
          test -s candidate/run-id.txt
          test -s candidate/mobile-metadata.json
          test -s candidate/signing-state.txt
          test "$(tr -d '\r\n' < candidate/source-sha.txt)" = "$GITHUB_SHA"
          test "$(tr -d '\r\n' < candidate/run-id.txt)" = "$EXPECTED_RUN_ID"
          test "$(tr -d '\r\n' < candidate/signing-state.txt)" = "UNSIGNED_VERIFIED_CANDIDATE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('candidate')
          metadata = json.loads((root / 'mobile-metadata.json').read_text())
          assert metadata['artifact_name'] == 'Cyclone-Android-3.9.6'
          assert metadata['application_id'] == 'com.cyclone.mobile'
          assert metadata['version_name'] == '3.9.6'
          assert int(metadata['version_code']) == 60
          assert metadata['apk_name'] == 'Cyclone-3.9.6.apk'
          assert (root / metadata['apk_name']).is_file()
          assert len(list(root.glob('*.apk'))) == 1
          PY
          (cd candidate && sha256sum --check Cyclone-3.9.6.apk.sha256)

      - name: Set up Android signing tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build tools
        shell: bash
        run: sdkmanager --install 'build-tools;35.0.0'

      - name: Recover update-compatible personal-development signer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          legacy_ref='release/cyclone-mobile-v3.9.0'
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/release.keystore.b64?ref=$legacy_ref" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/release.keystore.b64"
          base64 --decode "$RUNNER_TEMP/release.keystore.b64" > "$RUNNER_TEMP/release.keystore"
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/app/build.gradle.kts?ref=$legacy_ref" --jq .content \
            | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/legacy.gradle.kts"
          python3 - "$RUNNER_TEMP/legacy.gradle.kts" "$RUNNER_TEMP/legacy-signing.env" <<'PY'
          import re, shlex, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          match = re.search(r'create\("ciRelease"\)\s*\{(?P<body>.*?)\n\s*\}', text, re.S)
          if not match:
              raise SystemExit('legacy ciRelease signing block not found')
          body = match.group('body')
          def value(name):
              found = re.search(rf'{name}\s*=\s*"([^"]+)"', body)
              if not found:
                  raise SystemExit(f'legacy {name} not found')
              return found.group(1)
          with open(sys.argv[2], 'w', encoding='utf-8') as out:
              out.write('STORE_PASSWORD=' + shlex.quote(value('storePassword')) + '\n')
              out.write('KEY_ALIAS=' + shlex.quote(value('keyAlias')) + '\n')
              out.write('KEY_PASSWORD=' + shlex.quote(value('keyPassword')) + '\n')
          PY
          chmod 600 "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/legacy-signing.env"

      - name: Sign and verify update continuity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/legacy-signing.env"
          export STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          mkdir -p signed "$RUNNER_TEMP/previous"
          input='candidate/Cyclone-3.9.6.apk'
          output='signed/Cyclone-3.9.6.apk'
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$output" \
            "$input"
          "$apksigner" verify --min-sdk-version 34 --verbose --print-certs "$output" | tee signed/signing-info.txt
          "$aapt" dump badging "$output" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.cyclone.mobile'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='60'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='3.9.6'" "$RUNNER_TEMP/badging.txt"
          if grep -Eq 'testOnly[= ]true' "$RUNNER_TEMP/badging.txt"; then
            echo 'ERROR: signed release APK is testOnly.' >&2
            exit 1
          fi

          gh release download v3.9.5 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Cyclone-3.9.5.apk' --dir "$RUNNER_TEMP/previous"
          previous_cert="$("$apksigner" verify --min-sdk-version 34 --print-certs "$RUNNER_TEMP/previous/Cyclone-3.9.5.apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          current_cert="$("$apksigner" verify --min-sdk-version 34 --print-certs "$output" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          test -n "$previous_cert"
          test "$current_cert" = "$previous_cert"

          (cd signed && sha256sum Cyclone-3.9.6.apk > Cyclone-3.9.6.apk.sha256)
          cp candidate/source-sha.txt candidate/run-id.txt candidate/mobile-metadata.json signed/
          printf '%s\n' 'SIGNED_LEGACY_UPDATE_COMPATIBILITY_KEY_PERSONAL_DEV' > signed/signing-state.txt

      - name: Destroy recovered signing material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/release.keystore" \
            "$RUNNER_TEMP/release.keystore.b64" \
            "$RUNNER_TEMP/legacy.gradle.kts" \
            "$RUNNER_TEMP/legacy-signing.env" \
            "$RUNNER_TEMP/previous" \
            "$RUNNER_TEMP/badging.txt"

      - name: Upload signed personal-development artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cyclone-3.9.6-personal-dev
          path: signed/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable 3.9.6 prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Cyclone 3.9.6 personal-development prerelease.

          3.9.6 integrates the model-portability lane, grounded Android-runtime hardening, and the first V4 execution-session/live-frame foundation. It adds typed OpenRouter model profiles and provider qualification, explicit Contributor identity, bounded output repair, target-first Android action intent so notification Block cannot be mistaken for SEND, typed site-notification completion contracts, execution-session isolation primitives, and bounded LiveFrame/FrameSource infrastructure for later continuous vision and hidden-workspace work.

          V4 continuous MediaProjection vision, multi-display Accessibility routing, Shizuku/root backends, and hidden third-party app workspaces are intentionally NOT included in this release. Physical Pixel 8 acceptance remains UNVERIFIED and is not implied by CI success.

          Publication uses the exact successful Mobile CI artifact for this source SHA. The APK reuses the historical update-compatible development signer so it can update the existing personal-development installation. That signer is not production-secure.
          EOF
          gh release create v3.9.6 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Cyclone 3.9.6' \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            signed/Cyclone-3.9.6.apk \
            signed/Cyclone-3.9.6.apk.sha256 \
            signed/source-sha.txt \
            signed/run-id.txt \
            signed/mobile-metadata.json \
            signed/signing-state.txt \
            signed/signing-info.txt
