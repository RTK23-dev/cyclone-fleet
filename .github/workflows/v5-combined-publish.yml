name: Publish paired Cyclone V5 Mobile and Glass prerelease

# This file must exist on the repository default branch before workflow_dispatch
# can be invoked with --ref pointing to the exact release branch.
on:
  workflow_dispatch:
    inputs:
      mobile_ci_run_id:
        description: Successful exact-source Mobile CI push run ID
        required: true
        type: string
      signing_run_id:
        description: Successful protected Android signing workflow run ID
        required: true
        type: string
      glass_ci_run_id:
        description: Successful exact-source Windows CI push run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-paired-v5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.7'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Gate release identity and branch
        id: identity
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/ci/release_versions.py --check
          python - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          meta = tomllib.loads(Path('release/version.toml').read_text(encoding='utf-8'))
          mobile = meta['components']['mobile']
          glass = meta['components']['pc_companion']
          if meta['release']['publication_authorized'] is not True:
              raise SystemExit('Publication remains disabled in release/version.toml')
          if not mobile.startswith('5.0.0-alpha.2') or not glass.startswith('1.6.0-alpha.'):
              raise SystemExit('Refusing a non-V5 alpha.2 paired release')
          if meta['release']['candidate_generation'] != 'cyclone-v5-alpha2-dev3':
              raise SystemExit('Unexpected candidate generation')
          if os.environ['RELEASE_REF'] != f'release/cyclone-mobile-v{mobile}':
              raise SystemExit('Release branch must match exact Mobile version')
          if meta['channel'] != 'development':
              raise SystemExit('V5 alpha.2 release channel changed unexpectedly')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'mobile={mobile}\nglass={glass}\ncode={meta["android_version_code"]}\n')
          PY
      - name: Verify all three exact-source GitHub Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_RUN: ${{ inputs.mobile_ci_run_id }}
          SIGNING_RUN: ${{ inputs.signing_run_id }}
          GLASS_RUN: ${{ inputs.glass_ci_run_id }}
        run: |
          set -euo pipefail
          for run_id in "$MOBILE_RUN" "$SIGNING_RUN" "$GLASS_RUN"; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID' >&2; exit 1; }
          done
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${MOBILE_RUN}" |
            jq -e --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" \
              '.name == "Cyclone Mobile CI" and .path == ".github/workflows/mobile-ci.yml" and .event == "push" and .head_branch == $branch and .head_sha == $sha and .head_repository.full_name == $repo and .status == "completed" and .conclusion == "success"' >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SIGNING_RUN}" |
            jq -e --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" \
              '.name == "Cyclone Mobile Release Signing" and .path == ".github/workflows/mobile-release.yml" and .event == "workflow_dispatch" and .head_branch == $branch and .head_sha == $sha and .head_repository.full_name == $repo and .status == "completed" and .conclusion == "success"' >/dev/null
      - name: Download exact protected Android signing artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Cyclone-Android-${{ steps.identity.outputs.mobile }}-signed
          run-id: ${{ inputs.signing_run_id }}
          github-token: ${{ github.token }}
          path: dist/mobile
      - name: Stage verified Glass CI installer
        id: glass
        uses: ./.github/actions/stage-glass-ci
        with:
          github_token: ${{ github.token }}
          ci_run_id: ${{ inputs.glass_ci_run_id }}
          source_sha: ${{ github.sha }}
          release_branch: ${{ github.ref_name }}
          glass_version: ${{ steps.identity.outputs.glass }}
          output_directory: dist/glass
      - name: Verify signed APK identity and signature (physical testing waived)
        id: verified
        env:
          MOBILE_RUN: ${{ inputs.mobile_ci_run_id }}
          SIGNING_RUN: ${{ inputs.signing_run_id }}
          GLASS_RUN: ${{ inputs.glass_ci_run_id }}
          MOBILE_VERSION: ${{ steps.identity.outputs.mobile }}
          MOBILE_CODE: ${{ steps.identity.outputs.code }}
        run: |
          set -euo pipefail
          sdkmanager --install 'build-tools;35.0.0'
          apk="dist/mobile/Cyclone-${MOBILE_VERSION}.apk"
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$apksigner" verify --min-sdk-version 33 --verbose --print-certs "$apk" > dist/apksigner-verification.txt
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: \([0-9a-fA-F]\{64\}\)$/\1/p' dist/apksigner-verification.txt | head -1 | tr 'A-F' 'a-f')"
          [[ "$signer" =~ ^[0-9a-f]{64}$ ]] || { echo 'Could not verify signer certificate' >&2; exit 1; }
          "$aapt" dump badging "$apk" | grep -F "package: name='com.cyclone.mobile' versionCode='${MOBILE_CODE}' versionName='${MOBILE_VERSION}'" >/dev/null
          python scripts/ci/verify_v5_combined_release.py \
            --mobile-dir dist/mobile --glass-dir dist/glass \
            --skip-physical-testing --source-sha "$GITHUB_SHA" \
            --mobile-run-id "$MOBILE_RUN" --signing-run-id "$SIGNING_RUN" \
            --glass-run-id "$GLASS_RUN" --observed-signer-sha256 "$signer" \
            --manifest dist/release-manifest.json
      - name: Refuse overwrite of an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_VERSION: ${{ steps.identity.outputs.mobile }}
        run: |
          if gh release view "v${MOBILE_VERSION}" >/dev/null 2>&1; then
            echo "Release v${MOBILE_VERSION} already exists; refusing replacement" >&2
            exit 1
          fi
      - name: Generate concise paired release notes
        env:
          MOBILE_VERSION: ${{ steps.identity.outputs.mobile }}
          GLASS_VERSION: ${{ steps.identity.outputs.glass }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('dist/release-manifest.json').read_text())
          text = "\n".join([
              "# Cyclone V5 alpha.2 paired test release", "",
              f"Download **{m['signed_apk']}** for Android and **{m['glass_installer']}** for Windows from the assets below. Install the APK as an update over your existing Cyclone app; preserve app data. Use the Glass installer on Windows and pair it with the updated phone. Check each SHA-256 against `release-manifest.json` first.",
              "",
              f"Mobile: `{m['mobile_version']}` (code {m['mobile_version_code']}). Glass: `{m['glass_version']}`. Both assets come from exact-source CI at `{m['source_sha']}`. The Android APK was signed by the protected signing workflow, and the Glass installer passed installed Windows CI acceptance.",
              "Physical-device acceptance was explicitly waived by the owner. This alpha has NOT been tested on a physical phone, and the in-place upgrade and real Phone-to-Glass behavior are unverified. Back up important data before testing. Do not uninstall your existing app to resolve an update error.",
              "",
              "This is a V5 alpha prerelease. Windows Authenticode may be absent; Windows can show a SmartScreen warning for an unsigned Glass installer.", "",
          ])
          Path('dist/RELEASE_NOTES.md').write_text(text, encoding='utf-8')
          PY
      - name: Publish one paired GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_VERSION: ${{ steps.identity.outputs.mobile }}
        run: |
          set -euo pipefail
          gh release create "v${MOBILE_VERSION}" \
            "dist/mobile/Cyclone-${MOBILE_VERSION}.apk" \
            "dist/mobile/Cyclone-${MOBILE_VERSION}.apk.sha256" \
            dist/glass/Cyclone-PC-Companion-*-Setup.exe \
            dist/glass/SHA256SUMS.txt \
            dist/glass/release-provenance.json \
            dist/glass/installer-acceptance.json \
            dist/glass/THIRD_PARTY_NOTICES \
            dist/release-manifest.json \
            --target "$GITHUB_SHA" \
            --title "Cyclone V5 alpha.2 — Mobile and Glass" \
            --prerelease --notes-file dist/RELEASE_NOTES.md
