name: Cyclone Mobile Publish 3.9.1 Emergency

on:
  push:
    branches: ['release/cyclone-mobile-v3.9.1']
    paths:
      - '.github/workflows/mobile-publish-v391-emergency.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mobile-publish-v3.9.1-emergency
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate authoritative source build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/33911511957)"
          test "$(jq -r '.name' <<< "$run_json")" = "Cyclone Mobile CI"
          test "$(jq -r '.conclusion' <<< "$run_json")" = "success"
          test "$(jq -r '.event' <<< "$run_json")" = "push"
          test "$(jq -r '.head_sha' <<< "$run_json")" = "7b293f4c416780d2f943c4feed067f8d3da576c6"
          test "$(jq -r '.head_branch' <<< "$run_json")" = "release/cyclone-mobile-v3.9.1"
          if gh release view v3.9.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v3.9.1 already exists; refusing duplicate publication.' >&2
            exit 1
          fi

      - name: Download verified unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Cyclone-Android-3.9.1
          run-id: '33911511957'
          github-token: ${{ github.token }}
          path: candidate

      - name: Verify candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s candidate/Cyclone-3.9.1.apk
          test "$(tr -d '\r\n' < candidate/source-sha.txt)" = "7b293f4c416780d2f943c4feed067f8d3da576c6"
          test "$(tr -d '\r\n' < candidate/run-id.txt)" = "33911511957"
          test "$(tr -d '\r\n' < candidate/signing-state.txt)" = "UNSIGNED_VERIFIED_CANDIDATE"
          (cd candidate && sha256sum --check Cyclone-3.9.1.apk.sha256)
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path('candidate/mobile-metadata.json').read_text())
          assert metadata['apk_name'] == 'Cyclone-3.9.1.apk'
          assert metadata['application_id'] == 'com.cyclone.mobile'
          assert metadata['version_code'] == 55
          assert metadata['version_name'] == '3.9.1'
          PY

      - name: Set up Android signing tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build tools
        shell: bash
        run: sdkmanager --install 'build-tools;35.0.0'

      - name: Recover legacy update-compatible signer from repository history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          legacy_ref='release/cyclone-mobile-v3.9.0'
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/release.keystore.b64?ref=$legacy_ref" --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/release.keystore.b64"
          base64 --decode "$RUNNER_TEMP/release.keystore.b64" > "$RUNNER_TEMP/release.keystore"
          gh api "repos/$GITHUB_REPOSITORY/contents/apps/mobile/app/build.gradle.kts?ref=$legacy_ref" --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/legacy.gradle.kts"
          python3 - "$RUNNER_TEMP/legacy.gradle.kts" "$RUNNER_TEMP/legacy-signing.env" <<'PY'
          import re, shlex, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          match = re.search(r'create\("ciRelease"\)\s*\{(?P<body>.*?)\n\s*\}', text, re.S)
          if not match:
              raise SystemExit('legacy ciRelease signing block not found')
          body = match.group('body')
          def value(name):
              m = re.search(rf'{name}\s*=\s*"([^"]+)"', body)
              if not m:
                  raise SystemExit(f'legacy {name} not found')
              return m.group(1)
          with open(sys.argv[2], 'w', encoding='utf-8') as out:
              out.write('STORE_PASSWORD=' + shlex.quote(value('storePassword')) + '\n')
              out.write('KEY_ALIAS=' + shlex.quote(value('keyAlias')) + '\n')
              out.write('KEY_PASSWORD=' + shlex.quote(value('keyPassword')) + '\n')
          PY
          chmod 600 "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/legacy-signing.env"

      - name: Sign Cyclone 3.9.1 for update compatibility
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/legacy-signing.env"
          export STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          mkdir -p signed
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out signed/Cyclone-3.9.1.apk \
            candidate/Cyclone-3.9.1.apk
          "$apksigner" verify --verbose --print-certs signed/Cyclone-3.9.1.apk
          (cd signed && sha256sum Cyclone-3.9.1.apk > Cyclone-3.9.1.apk.sha256)
          cp candidate/source-sha.txt candidate/run-id.txt candidate/mobile-metadata.json signed/
          printf '%s\n' 'SIGNED_LEGACY_UPDATE_COMPATIBILITY_KEY' > signed/signing-state.txt

      - name: Verify certificate continuity with Cyclone 3.8.9
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior
          gh release download v3.8.9 --repo "$GITHUB_REPOSITORY" --pattern 'Cyclone-3.8.9.apk' --dir prior
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs signed/Cyclone-3.9.1.apk > "$RUNNER_TEMP/new-cert.txt"
          "$apksigner" verify --verbose --print-certs prior/Cyclone-3.8.9.apk > "$RUNNER_TEMP/old-cert.txt"
          new_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-cert.txt" | head -n 1 | tr 'A-F' 'a-f')"
          old_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/old-cert.txt" | head -n 1 | tr 'A-F' 'a-f')"
          test -n "$new_cert"
          test "$new_cert" = "$old_cert"
          echo 'Verified 3.9.1 uses the same certificate as 3.8.9 for in-place update compatibility.'

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # Cyclone 3.9.1

          Cyclone 3.9.1 is the runtime-hardening and repository-refresh prerelease.

          ## Highlights
          - Faster event-driven Android UI coordination with fewer redundant accessibility rescans.
          - Durable, privacy-bounded task checkpoints and stronger recovery boundaries.
          - Downloadable, bounded Brain run diagnostics for successful and failed runs.
          - Modern Ask Cyclone chat composer with model selection.
          - Less intrusive bottom-center Aurora activation overlay.
          - Retired stale MobileRun production surfaces in favor of Cyclone-native control paths.
          - Stronger product, security, PC Gateway, MCP, Android unit-test, lint and release-build guards.

          ## Verification
          - Version: `3.9.1`
          - Android versionCode: `55`
          - Package: `com.cyclone.mobile`
          - Authoritative source SHA: `7b293f4c416780d2f943c4feed067f8d3da576c6`
          - Authoritative CI run: `33911511957`
          - Unit tests, Android lint and unsigned release assembly: PASS
          - Physical Pixel 8 acceptance: UNVERIFIED in this environment

          ## Signing notice
          This emergency publication uses the same Android signing certificate as Cyclone 3.8.9 so existing sideloaded installations can update in place. That legacy key was previously committed to public repository history and must be considered exposed. A signing-key rotation remains required for subsequent releases.
          EOF

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v3.9.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target '7b293f4c416780d2f943c4feed067f8d3da576c6' \
            --title 'Cyclone 3.9.1' \
            --prerelease \
            --notes-file release-notes.md \
            signed/Cyclone-3.9.1.apk \
            signed/Cyclone-3.9.1.apk.sha256 \
            signed/mobile-metadata.json \
            signed/source-sha.txt \
            signed/run-id.txt \
            signed/signing-state.txt

      - name: Destroy recovered signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/release.keystore.b64" "$RUNNER_TEMP/legacy.gradle.kts" "$RUNNER_TEMP/legacy-signing.env"
